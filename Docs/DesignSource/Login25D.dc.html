body{margin:0}
a{color:#3A2412;text-decoration:none}a:hover{color:#000}
.txt3d{-webkit-text-stroke:5px #3A2412;paint-order:stroke fill;text-shadow:0 4px 0 #3A2412,0 8px 12px rgba(0,0,0,.25)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid #3A2412;border-radius:18px;background:linear-gradient(180deg,var(--hi) 0%,var(--base) 55%,var(--lo) 100%);box-shadow:0 5px 0 var(--edge),0 10px 14px rgba(0,0,0,.22),inset 0 -3px 0 rgba(0,0,0,.08);position:relative;font-family:inherit;font-weight:800;color:#3A2412;cursor:pointer;transition:transform .08s,box-shadow .08s}
.gbtn::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:40%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge),0 4px 6px rgba(0,0,0,.25)}
.gbtn[disabled]{cursor:default;filter:saturate(.4);opacity:.75}
.panel{background:linear-gradient(180deg,#FFFFFF 0%,#F3EEE4 100%);border:3px solid #3A2412;border-radius:16px;box-shadow:0 4px 0 #B9A98C,0 8px 12px rgba(0,0,0,.18)}
.card{background:linear-gradient(180deg,#FFFBEF,#F7E9C6);border:3px solid #3A2412;border-radius:26px;box-shadow:0 6px 0 #B9A98C,0 18px 26px rgba(0,0,0,.25)}
.field{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:14px;font-weight:800}
.inp{display:flex;align-items:center;gap:8px;height:50px;padding:0 8px 0 12px;border:3px solid #3A2412;border-radius:16px;background:linear-gradient(180deg,#FFFFFF,#F6F1E7);box-shadow:inset 0 3px 0 rgba(0,0,0,.06),0 3px 0 #C9BB9E;transition:box-shadow .15s,border-color .15s}
.inp:focus-within{border-color:#E07A1A;box-shadow:0 0 0 4px rgba(255,159,28,.35),0 3px 0 #C9BB9E}
.inp input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-family:inherit;font-size:16px;font-weight:700;color:#3A2412}
.inp input::placeholder{color:#8F7F68}
.eye{flex:none;width:40px;height:40px;padding:0;border:0;border-radius:12px;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.eye:hover{background:rgba(58,36,18,.08)}
.link{font-weight:800;color:#C4520A;text-decoration:underline;text-underline-offset:3px}
.check{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;flex:none;cursor:pointer;border:3px solid #3A2412;border-radius:8px;background:#FFFFFF;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);box-sizing:border-box;display:inline-grid;place-content:center;transition:background .15s}
.check::after{content:"";width:12px;height:7px;border-left:3px solid #FFFFFF;border-bottom:3px solid #FFFFFF;border-radius:1px;transform:translateY(-2px) rotate(-45deg) scale(0);transition:transform .15s}
.check:checked{background:linear-gradient(180deg,#7FE08A,#3DB654)}
.check:checked::after{transform:translateY(-2px) rotate(-45deg) scale(1)}
.check:focus-visible{outline:3px solid #FFC93C;outline-offset:2px}
.cloud{position:absolute;background:#FFFFFF;border-radius:40px;box-shadow:inset 0 -6px 0 rgba(160,200,230,.45);animation:drift 24s ease-in-out infinite alternate}
.bob{animation:bob 1.6s ease-in-out infinite}
.enter{animation:enter .5s cubic-bezier(.2,.9,.3,1.2) both}
.av{flex:none;border-radius:50%;border:3px solid #3A2412;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.4s linear infinite}
.logo{animation:logoIn .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes logoIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(20px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes enter{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}}
</style>

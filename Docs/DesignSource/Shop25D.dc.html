<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cửa hàng 2.5D – Đập Thú</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A2412;text-decoration:none}a:hover{color:#000}
.txt3d{-webkit-text-stroke:5px #3A2412;paint-order:stroke fill;text-shadow:0 4px 0 #3A2412,0 8px 12px rgba(0,0,0,.25)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid #3A2412;border-radius:18px;background:linear-gradient(180deg,var(--hi) 0%,var(--base) 55%,var(--lo) 100%);box-shadow:0 5px 0 var(--edge),0 10px 14px rgba(0,0,0,.22),inset 0 -3px 0 rgba(0,0,0,.08);position:relative;font-family:inherit;font-weight:800;color:#3A2412;cursor:pointer;transition:transform .08s,box-shadow .08s}
.gbtn::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:40%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge),0 4px 6px rgba(0,0,0,.25)}
.gbtn[disabled]{cursor:default;filter:saturate(.55);opacity:.85}
.panel{background:linear-gradient(180deg,#FFFFFF 0%,#F3EEE4 100%);border:3px solid #3A2412;border-radius:16px;box-shadow:0 4px 0 #B9A98C,0 8px 12px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:6px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 9px;border:3px solid #3A2412;border-radius:18px;font-family:inherit;color:#3A2412;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card svg.w{width:62px;height:62px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.card.on{transform:translateY(-6px)}
.card.on svg.w{animation:wobble 1.2s ease-in-out infinite}
.qty{position:absolute;top:5px;right:5px;min-width:24px;border:2px solid #3A2412;border-radius:999px;background:linear-gradient(180deg,#A8DCFF,#3FA9F5);color:#FFFFFF;font-size:12px;font-weight:800;line-height:18px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.shine{position:absolute;inset:0;pointer-events:none}
.shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:30px;left:-50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:sweep 2.6s ease-in-out infinite}
.bar{height:12px;border-radius:6px;background:linear-gradient(180deg,#CFC5B2,#E9E1D0);border:2px solid #3A2412;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.2)}
.fill{height:100%;border-radius:4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width .35s cubic-bezier(.2,.9,.3,1.2)}
.detail{animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
.bumpA{animation:bumpA .35s ease-out}
.bumpB{animation:bumpB .35s ease-out}
@keyframes wobble{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-8deg) translateY(-3px)}75%{transform:rotate(8deg) translateY(-3px)}}
@keyframes sweep{0%,50%{left:-50px}85%,100%{left:120%}}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:scale(1);opacity:1}}
@keyframes bumpA{40%{transform:scale(1.18)}}
@keyframes bumpB{40%{transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}}
.chips{scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent 100%)}
.chips::-webkit-scrollbar{display:none}
.petScroll{max-height:262px;overflow-y:auto;margin:0 -10px;padding:0 10px 14px;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 8px,#000 calc(100% - 26px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 8px,#000 calc(100% - 26px),transparent 100%)}
.petScroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 0%, #FFF5D6 0%, #FFE2A0 55%, #F7C873 100%); font-family: 'Baloo 2', system-ui, sans-serif; color: #3A2412">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <linearGradient id="hWoodHead" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C584"/><stop offset=".6" stop-color="#D09050"/><stop offset="1" stop-color="#9A6230"/></linearGradient>
      <linearGradient id="hWoodHandle" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8E5A2A"/><stop offset=".45" stop-color="#C98C50"/><stop offset="1" stop-color="#7A4A22"/></linearGradient>
      <linearGradient id="hSole" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2F6B3A"/><stop offset=".45" stop-color="#5BA068"/><stop offset="1" stop-color="#2A5E33"/></linearGradient>
      <linearGradient id="hBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1F7FC4"/><stop offset=".45" stop-color="#7CC8FF"/><stop offset="1" stop-color="#1A6AA8"/></linearGradient>
      <radialGradient id="hMesh" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFEAFB"/></radialGradient>
      <linearGradient id="hRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF9A8F"/><stop offset=".55" stop-color="#FF4D4D"/><stop offset="1" stop-color="#C62828"/></linearGradient>
      <linearGradient id="hYellow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E0A800"/><stop offset=".45" stop-color="#FFEA7A"/><stop offset="1" stop-color="#D19A00"/></linearGradient>
      <radialGradient id="hPan" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#7A7A88"/><stop offset=".6" stop-color="#3A3A46"/><stop offset="1" stop-color="#16161C"/></radialGradient>
      <linearGradient id="hSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6ECF2"/><stop offset=".5" stop-color="#A9B4C0"/><stop offset="1" stop-color="#6E7A88"/></linearGradient>
      <linearGradient id="hSteelDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B9C3CE"/><stop offset="1" stop-color="#5A6572"/></linearGradient>
      <radialGradient id="hCoin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF3A0"/><stop offset=".55" stop-color="#FFC93C"/><stop offset="1" stop-color="#D08A00"/></radialGradient>
      <radialGradient id="hBun" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#EDE7F0"/><stop offset="1" stop-color="#B9AFC2"/></radialGradient>
      <radialGradient id="hInk" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#5A5E6A"/><stop offset="1" stop-color="#1E2028"/></radialGradient>
      <radialGradient id="hDuck" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFF6B0"/><stop offset=".55" stop-color="#FFD84A"/><stop offset="1" stop-color="#E0A800"/></radialGradient>
      <linearGradient id="hBill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB870"/><stop offset="1" stop-color="#EE7414"/></linearGradient>
      <radialGradient id="hPeng" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#6A7284"/><stop offset=".55" stop-color="#2E3442"/><stop offset="1" stop-color="#14161C"/></radialGradient>
      <radialGradient id="hDino" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#C6F5A0"/><stop offset=".55" stop-color="#6CC04A"/><stop offset="1" stop-color="#3A7A28"/></radialGradient>
      <radialGradient id="hShell" cx=".4" cy=".25" r=".85"><stop offset="0" stop-color="#C7E59A"/><stop offset=".55" stop-color="#7DAE48"/><stop offset="1" stop-color="#3F6A22"/></radialGradient>
      <radialGradient id="hCamel" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#F7DDB0"/><stop offset=".55" stop-color="#D9A866"/><stop offset="1" stop-color="#9A6A32"/></radialGradient>
      <radialGradient id="hDolphin" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#C8EBFF"/><stop offset=".55" stop-color="#5FB4E8"/><stop offset="1" stop-color="#2A6FA8"/></radialGradient>
      <radialGradient id="hGhost" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F1EEFA"/><stop offset="1" stop-color="#C4BCDC"/></radialGradient>
      <radialGradient id="hOwlB" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#D9A86C"/><stop offset=".6" stop-color="#A8743E"/><stop offset="1" stop-color="#6E4620"/></radialGradient>
      <radialGradient id="hOwl" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#EEF2F6"/><stop offset="1" stop-color="#B8C3CF"/></radialGradient>
      <linearGradient id="hHorn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E0A800"/><stop offset=".5" stop-color="#FFF3A0"/><stop offset="1" stop-color="#D19A00"/></linearGradient>
      <radialGradient id="hClock" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#D8F1FF"/><stop offset=".55" stop-color="#4FB0EE"/><stop offset="1" stop-color="#1F7FC4"/></radialGradient>
      <radialGradient id="hStar" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFE0EA"/><stop offset=".55" stop-color="#FF7FA8"/><stop offset="1" stop-color="#C93A6E"/></radialGradient>
      <linearGradient id="hShield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8F1FF"/><stop offset=".55" stop-color="#7CC8FF"/><stop offset="1" stop-color="#2A7FBF"/></linearGradient>
      <linearGradient id="hFire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE14A"/><stop offset=".5" stop-color="#FF9F1C"/><stop offset="1" stop-color="#E53935"/></linearGradient>
    </defs>
  </svg>
  <div style="height: 100%; box-sizing: border-box; padding: 56px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Main25D.dc.html" aria-label="Quay lại" class="gbtn" style="--hi: #FFFFFF; --base: #F1ECE2; --lo: #D9D0BF; --edge: #A8977A; width: 48px; height: 48px; padding: 0; border-radius: 14px">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3A2412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 class="txt3d" style="margin: 0; flex: 1; min-width: 0; font-size: 30px; line-height: 1; color: #FFFFFF; white-space: nowrap">CỬA HÀNG</h1>
      <div class="panel {{bumpCls}}" style="display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 800; font-size: 16px">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="url(#hCoin)" stroke="#3A2412" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#C07A00" stroke-width="2"/><ellipse cx="9" cy="8" rx="3" ry="1.6" fill="#FFFFFF" opacity=".6"/></svg>
        {{coinsText}}
      </div>
    </div>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: linear-gradient(180deg, #E9DFCB, #F6F0E4); border: 3px solid #3A2412; border-radius: 16px; padding: 4px; gap: 4px; box-shadow: inset 0 3px 4px rgba(0,0,0,.15)">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{tb.selected}}" onClick="{{tb.pick}}" class="gbtn" style="{{tb.style}}">{{tb.label}}</button>
      </sc-for>
    </div>

    <!-- detail -->
    <div class="panel detail" style="background: linear-gradient(180deg, #FFFBEF, #F7E9C6); border-radius: 22px; box-shadow: 0 5px 0 #B9A98C, 0 14px 20px rgba(0,0,0,.2); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
        <span style="font-size: 24px; font-weight: 800; line-height: 1">{{sel.name}}</span>
        <sc-if value="{{sel.premium}}" hint-placeholder-val="{{ false }}"><span style="background: linear-gradient(180deg, #C9A2FF, #8A4FD8); color: #FFFFFF; border: 2px solid #3A2412; border-radius: 8px; padding: 0 6px; font-size: 12px; font-weight: 800; box-shadow: 0 2px 0 #4E2490">HUYỀN THOẠI</span></sc-if>
        <sc-if value="{{sel.hasSub}}" hint-placeholder-val="{{ false }}"><span style="background: #FFFFFF; border: 2px solid #3A2412; border-radius: 8px; padding: 0 6px; font-size: 12px; font-weight: 800">{{sel.sub}}</span></sc-if>
      </div>
      <div style="font-size: 14px; font-weight: 700; color: #5E4E3A; line-height: 1.3">{{sel.desc}}</div>
      <sc-if value="{{sel.hasFree}}" hint-placeholder-val="{{ false }}">
        <a href="DailyReward25D.dc.html" style="display: flex; align-items: center; gap: 6px; align-self: flex-start; border: 2px solid #3A2412; border-radius: 999px; padding: 1px 10px 1px 4px; font-size: 12px; font-weight: 800; background: linear-gradient(180deg, #FFF3B0, #FFC93C)"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11.5" rx="2" fill="#FF6B4A" stroke="#3A2412" stroke-width="1.6"/><rect x="2.5" y="6.5" width="19" height="4" rx="1.5" fill="#FF8A80" stroke="#3A2412" stroke-width="1.6"/><path d="M12 6.5V20.5" stroke="#FFE14A" stroke-width="2.4"/><path d="M12 6.5 Q8 1.5 6.5 4.5 Q6 6.5 12 6.5 Q18 6.5 17.5 4.5 Q16 1.5 12 6.5Z" fill="#FFE14A" stroke="#3A2412" stroke-width="1.3"/></svg>{{sel.freeText}}</a>
      </sc-if>
      <sc-if value="{{sel.hasStats}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: 84px minmax(0, 1fr) 70px; column-gap: 8px; row-gap: 6px; align-items: center; font-size: 13px; font-weight: 800">
          <sc-for list="{{sel.stats}}" as="st" hint-placeholder-count="3">
            <span style="white-space: nowrap">{{st.label}}</span>
            <div class="bar" role="img" aria-label="{{st.aria}}"><div class="fill" style="{{st.style}}"></div></div>
            <span style="text-align: right; white-space: nowrap; color: #5E4E3A">{{st.word}}</span>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{sel.isItem}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800">
          <span>Đang có:</span>
          <span style="border: 2px solid #3A2412; border-radius: 999px; padding: 0 10px; line-height: 22px; background: linear-gradient(180deg, #A8DCFF, #3FA9F5); color: #FFFFFF; text-shadow: 0 1px 0 rgba(0,0,0,.35)">x{{sel.qty}}</span>
          <span style="font-weight: 700; color: #5E4E3A">· dùng được trong mọi map</span>
        </div>
      </sc-if>
      <div style="display: flex; gap: 8px; margin-top: 4px">
        <sc-if value="{{sel.isEquipped}}" hint-placeholder-val="{{ true }}">
          <button disabled class="gbtn" style="--hi: #F3EEE4; --base: #E3DACA; --lo: #CFC3AE; --edge: #A8977A; flex: 1; height: 52px; font-size: 18px">Đang dùng</button>
        </sc-if>
        <sc-if value="{{sel.canEquip}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{equip}}" class="gbtn" style="--hi: #B8F5B0; --base: #5BD06A; --lo: #2FA444; --edge: #1F7A33; flex: 1; height: 52px; font-size: 18px">Trang bị</button>
        </sc-if>
        <sc-if value="{{sel.petIsOn}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{togglePet}}" aria-pressed="true" class="gbtn" style="--hi: #B8F5B0; --base: #5BD06A; --lo: #2FA444; --edge: #1F7A33; flex: 1; height: 52px; font-size: 16px"><span style="position: relative">{{sel.petOnText}}</span></button>
        </sc-if>
        <sc-if value="{{sel.petIsOff}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{togglePet}}" aria-pressed="false" class="gbtn" style="--hi: #FFE68A; --base: #FFC93C; --lo: #F0A400; --edge: #B87800; flex: 1; height: 52px; font-size: 16px"><span style="position: relative">{{sel.petOffText}}</span></button>
        </sc-if>
        <sc-if value="{{sel.isBase}}" hint-placeholder-val="{{ false }}">
          <button disabled class="gbtn" style="--hi: #E2F4FF; --base: #BDE3FF; --lo: #8CC8F0; --edge: #4F8FBF; flex: 1; height: 52px; font-size: 17px"><span style="position: relative">Có sẵn trong map</span></button>
        </sc-if>
        <sc-if value="{{sel.unlocked}}" hint-placeholder-val="{{ false }}">
          <button disabled class="gbtn" style="--hi: #D8FBD2; --base: #A6E59A; --lo: #6CC05E; --edge: #3E8A34; flex: 1; height: 52px; font-size: 18px">Đã mở khóa</button>
        </sc-if>
        <sc-if value="{{sel.canBuy}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{buy}}" class="gbtn" style="--hi: #FFE68A; --base: #FFC93C; --lo: #F0A400; --edge: #B87800; flex: 1; height: 52px; font-size: 18px">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="position: relative"><circle cx="12" cy="12" r="10" fill="url(#hCoin)" stroke="#3A2412" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#C07A00" stroke-width="2"/></svg>
            <span style="position: relative">Mua {{sel.priceText}}</span>
          </button>
        </sc-if>
        <sc-if value="{{sel.short}}" hint-placeholder-val="{{ false }}">
          <button disabled class="gbtn" style="--hi: #F3EEE4; --base: #E3DACA; --lo: #CFC3AE; --edge: #A8977A; flex: 1; height: 52px; font-size: 15px; color: #6B5A45">Thiếu {{sel.shortText}} xu</button>
        </sc-if>
        <sc-if value="{{sel.cash}}" hint-placeholder-val="{{ false }}">
          <button class="gbtn" style="--hi: #FFB8A0; --base: #FF6B4A; --lo: #E0482A; --edge: #A8321C; flex: 1; height: 52px; font-size: 18px; color: #FFFFFF; text-shadow: 0 2px 0 #A8321C"><span style="position: relative">{{sel.cash}}</span></button>
        </sc-if>
        <sc-if value="{{sel.isItem}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{buy1}}" disabled="{{sel.no1}}" class="gbtn" style="--hi: #FFE68A; --base: #FFC93C; --lo: #F0A400; --edge: #B87800; flex: 1; height: 52px; flex-direction: column; gap: 0; font-size: 17px">
            <span style="position: relative; line-height: 1">Mua x1</span>
            <span style="position: relative; line-height: 1; font-size: 12px">{{sel.price1}} xu</span>
          </button>
          <button onClick="{{buy5}}" disabled="{{sel.no5}}" class="gbtn" style="--hi: #B8F5B0; --base: #5BD06A; --lo: #2FA444; --edge: #1F7A33; flex: 1; height: 52px; flex-direction: column; gap: 0; font-size: 17px">
            <span style="position: absolute; top: -12px; right: -6px; z-index: 1; background: linear-gradient(180deg, #FF8A80, #E53935); color: #FFFFFF; border: 2px solid #3A2412; border-radius: 8px; padding: 0 5px; font-size: 11px; line-height: 16px">−20%</span>
            <span style="position: relative; line-height: 1">Mua x5</span>
            <span style="position: relative; line-height: 1; font-size: 12px">{{sel.price5}} xu</span>
          </button>
        </sc-if>
      </div>
    </div>

    <!-- tools -->
    <sc-if value="{{isTool}}" hint-placeholder-val="{{ true }}">
      <div class="petScroll" style="max-height: 300px">
      <div class="grid">

  }
  renderVals() {
    const s = this.state;
    const fmt = (n) => n.toLocaleString('vi-VN');
    const tab = s.tab;
    const list = this.catalog[tab];
    const cur = list.find((c) => c.id === s.picked[tab]);
    const isItem = tab === 'item';
    const owned = !!s.owned[cur.id] || !!cur.base;
    const statDefs = {
      tool: [['Sức mạnh', 'linear-gradient(180deg, #FFB8A0, #FF6B4A 60%, #E0482A)', ['Rất nhẹ', 'Nhẹ', 'Vừa', 'Mạnh', 'Rất mạnh']], ['Tầm đập', 'linear-gradient(180deg, #A8DCFF, #3FA9F5 60%, #1F7FC4)', ['1 ô', 'Hẹp', 'Vừa', 'Rộng', 'Cả hàng']], ['Tốc độ', 'linear-gradient(180deg, #A6F09A, #4CC25E 60%, #2E9E44)', ['Rất chậm', 'Chậm', 'Vừa', 'Nhanh', 'Rất nhanh']]],
      pet: [['Điểm thưởng', 'linear-gradient(180deg, #FFF3A0, #FFC93C 60%, #F0A400)', null], ['Tốc độ ló', 'linear-gradient(180deg, #A6F09A, #4CC25E 60%, #2E9E44)', ['Rất chậm', 'Chậm', 'Vừa', 'Nhanh', 'Rất nhanh']], ['Độ hiếm', 'linear-gradient(180deg, #DCC0FF, #9B5DE5 60%, #6A35B8)', ['Phổ biến', 'Thường gặp', 'Ít gặp', 'Hiếm', 'Cực hiếm']]]
    };
    const cards = {};
    ['tool', 'pet', 'item'].forEach((t) => this.catalog[t].forEach((c) => {
      const sel = s.picked[t] === c.id;
      const isOwned = t !== 'item' && (!!s.owned[c.id] || !!c.base);
      const isEq = t === 'tool' && s.equipped === c.id;
      const petOn = t === 'pet' && isOwned && !c.base && !!s.petOn[c.id];
      const tag = t === 'item' ? fmt(c.price) + ' xu' : (isEq || petOn) ? 'Đang dùng' : c.base ? 'Có sẵn' : isOwned ? 'Đã có' : fmt(c.price) + ' xu';
      const tagBg = (isEq || petOn) ? 'linear-gradient(180deg, #B8F5B0, #5BD06A)' : c.base ? 'linear-gradient(180deg, #E2F4FF, #A8DCFF)' : isOwned ? 'linear-gradient(180deg, #F3EEE4, #DDD3C0)' : 'linear-gradient(180deg, #FFE68A, #FFC93C)';
      const bg = c.premium ? 'linear-gradient(180deg, #F3E8FF, #D8BEFA)' : 'linear-gradient(180deg, #FFFFFF, #F1EADC)';
      const edge = c.premium ? '#8A62C4' : '#B9A98C';
      const q = s.qty[c.id] || 0;
      cards[c.id] = {
        cls: 'card' + (sel ? ' on' : ''),
        pressed: String(sel),
        tag,
        qty: q,
        hasQty: q > 0,
        tagStyle: 'position: relative; white-space: nowrap; font-size: ' + (t === 'pet' ? 11 : 12) + 'px; font-weight: 800; background: ' + tagBg + '; border: 2px solid #3A2412; border-radius: 999px; padding: 0 ' + (t === 'pet' ? 5 : 8) + 'px; line-height: 18px',
        style: 'background: ' + bg + '; box-shadow: 0 ' + (sel ? 9 : 4) + 'px 0 ' + edge + ', 0 ' + (sel ? 18 : 8) + 'px ' + (sel ? 20 : 10) + 'px rgba(0,0,0,' + (sel ? '.28' : '.16') + ')' + (sel ? '; outline: 3px solid #FF6B4A; outline-offset: 2px' : ''),
        pick: () => this.setState({ picked: Object.assign({}, s.picked, { [t]: c.id }) })
      };
    }));
    const MAPN = { land: 'Trên cạn', sea: 'Dưới biển', desert: 'Sa mạc', arctic: 'Bắc cực', grave: 'Nghĩa trang' };
    const MAPC = { land: 'linear-gradient(180deg, #A6F09A, #4CC25E)', sea: 'linear-gradient(180deg, #A8DCFF, #3FA9F5)', desert: 'linear-gradient(180deg, #FFD3A0, #FF9F43)', arctic: 'linear-gradient(180deg, #E2F4FF, #7FC4EE)', grave: 'linear-gradient(180deg, #D9CCF5, #A68CDC)' };
    const tabDefs = [['tool', 'Dụng cụ'], ['pet', 'Thú'], ['item', 'Vật phẩm']];
    const price5 = cur.price * 4;
    const bump = { bumpN: s.bumpN + 1 };
    return {
      coinsText: fmt(s.coins),
      bumpCls: s.bumpN === 0 ? '' : (s.bumpN % 2 ? 'bumpA' : 'bumpB'),
      isTool: tab === 'tool',
      isPet: tab === 'pet',
      isItem,
      isPetLand: tab === 'pet' && s.petMap === 'land',
      isPetSea: tab === 'pet' && s.petMap === 'sea',
      isPetDesert: tab === 'pet' && s.petMap === 'desert',
      isPetArctic: tab === 'pet' && s.petMap === 'arctic',
      isPetGrave: tab === 'pet' && s.petMap === 'grave',
      petMaps: ['land', 'sea', 'desert', 'arctic', 'grave'].map((m) => ({
        label: MAPN[m] + ' (' + this.catalog.pet.filter((p) => p.map === m).length + ')',
        selected: String(s.petMap === m),
        style: 'flex: none; padding: 0 12px; white-space: nowrap; height: 34px; border: 2px solid #3A2412; border-radius: 999px; font-family: inherit; font-size: 12px; font-weight: 800; color: #3A2412; cursor: pointer; ' + (s.petMap === m ? 'background: ' + MAPC[m] + '; box-shadow: 0 3px 0 rgba(58,36,18,.45)' : 'background: rgba(255,255,255,.7)'),
        pick: () => this.setState({ petMap: m, picked: Object.assign({}, s.picked, { pet: this.catalog.pet.find((p) => p.map === m).id }) })
      })),
      cards,
      tabs: tabDefs.map(([id, label]) => ({
        label,
        selected: String(tab === id),
        style: 'height: 40px; border-width: 2px; border-radius: 12px; font-size: 16px; ' + (tab === id ? '--hi: #FFE68A; --base: #FFC93C; --lo: #F0A400; --edge: #B87800; box-shadow: 0 3px 0 #B87800' : '--hi: transparent; --base: transparent; --lo: transparent; --edge: transparent; border-color: transparent; box-shadow: none; color: #5E4E3A'),
        pick: () => this.setState({ tab: id })
      })),
      sel: {
        name: cur.name,
        desc: cur.desc,
        premium: !!cur.premium,
        hasFree: !!cur.free && !owned,
        freeText: cur.free || '',
        hasSub: false,
        sub: tab === 'pet' ? MAPN[cur.map] + ' · +' + cur.pts : '',
        isPetSel: tab === 'pet',
        mapNote: tab === 'pet' ? 'Chỉ xuất hiện ở map ' + MAPN[cur.map] : '',
        petIsOn: tab === 'pet' && owned && !cur.base && !!s.petOn[cur.id],
        isBase: tab === 'pet' && !!cur.base,
        petIsOff: tab === 'pet' && owned && !cur.base && !s.petOn[cur.id],
        petOnText: 'Đang dùng ở ' + MAPN[cur.map],
        petOffText: 'Dùng ở ' + MAPN[cur.map],
        hasStats: !isItem,
        stats: isItem ? [] : statDefs[tab].map(([label, g, words], i) => {
          const v = cur.stats[i];
          const word = words ? words[v - 1] : '+' + cur.pts + ' điểm';
          return {
            label, word, aria: label + ': ' + v + ' trên 5, ' + word,
            style: 'width: ' + (v * 20) + '%; background: ' + g
          };
        }),
        isItem,
        qty: s.qty[cur.id] || 0,
        price1: fmt(cur.price),
        price5: fmt(price5),
        no1: s.coins < cur.price,
        no5: s.coins < price5,
        isEquipped: tab === 'tool' && s.equipped === cur.id,
        canEquip: tab === 'tool' && owned && s.equipped !== cur.id,
        unlocked: false,
        canBuy: !isItem && !owned && s.coins >= cur.price,
        short: !isItem && !owned && s.coins < cur.price,
        shortText: fmt(Math.max(0, cur.price - s.coins)),
        priceText: fmt(cur.price),
        cash: !isItem && !owned && cur.cash ? cur.cash : ''
      },
      equip: () => this.setState({ equipped: cur.id }),
      togglePet: () => this.setState({ petOn: Object.assign({}, s.petOn, { [cur.id]: !s.petOn[cur.id] }) }),
      buy: () => {
        if (owned || s.coins < cur.price) return;
        this.setState(Object.assign({ coins: s.coins - cur.price, owned: Object.assign({}, s.owned, { [cur.id]: true }) }, bump));
      },
      buy1: () => {
        if (s.coins < cur.price) return;
        this.setState(Object.assign({ coins: s.coins - cur.price, qty: Object.assign({}, s.qty, { [cur.id]: (s.qty[cur.id] || 0) + 1 }) }, bump));
      },
      buy5: () => {
        if (s.coins < price5) return;
        this.setState(Object.assign({ coins: s.coins - price5, qty: Object.assign({}, s.qty, { [cur.id]: (s.qty[cur.id] || 0) + 5 }) }, bump));
      },
      freeCoins: () => this.setState(Object.assign({ coins: s.coins + 100 }, bump))
    };
  }
}
</script>

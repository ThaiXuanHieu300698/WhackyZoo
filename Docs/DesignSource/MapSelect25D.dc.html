.card{flex:none;display:block;border:3px solid #3A2412;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#FFFFFF,#F5EFE3);box-shadow:0 6px 0 #B9A98C,0 16px 22px rgba(0,0,0,.22);transition:transform .15s,box-shadow .15s;animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 0 #B9A98C,0 22px 28px rgba(0,0,0,.25)}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #B9A98C,0 8px 12px rgba(0,0,0,.2)}
.bob{animation:bob 1.5s ease-in-out infinite}
.wiggle{transform-origin:50% 80%;animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-12deg)}88%{transform:rotate(10deg)}92%{transform:rotate(-6deg)}96%{transform:rotate(4deg)}}
.bub{position:absolute;border:2px solid rgba(220,245,255,.9);border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8),rgba(255,255,255,0) 50%);animation:rise 4s linear infinite}
.ray{position:absolute;top:-30px;width:34px;height:220px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));transform:rotate(16deg);animation:sway 5s ease-in-out infinite alternate}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
@keyframes sway{from{transform:rotate(12deg)}to{transform:rotate(22deg)}}
.cloudSway{animation:cloudSway 5s ease-in-out infinite alternate}
@keyframes cloudSway{from{transform:translateX(-8px)}to{transform:translateX(12px)}}
.flake{position:absolute;top:-8px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 3px rgba(255,255,255,.9);animation:snowfall 5s linear infinite}
@keyframes snowfall{0%{transform:translate(0,0);opacity:0}12%{opacity:1}100%{transform:translate(-12px,136px);opacity:.2}}
.flock{position:absolute;left:0;top:0;animation:flock 9s linear infinite}
@keyframes flock{0%{transform:translate(-110px,34px)}65%{transform:translate(440px,4px)}100%{transform:translate(440px,4px)}}
.batfly{position:absolute;animation:batBob .9s ease-in-out infinite alternate}
@keyframes batBob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.wingL,.wingR{transform-box:fill-box;animation:flap .22s ease-in-out infinite alternate}
.wingL{transform-origin:100% 40%}.wingR{transform-origin:0 40%}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.35)}}
.band{position:absolute;left:0;border-radius:999px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));filter:blur(2px);opacity:0;animation:band 7s ease-in-out infinite}
@keyframes band{0%{transform:translateX(-180px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(380px);opacity:0}}
@keyframes cardIn{from{transform:translateY(30px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
.soft-scroll{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.soft-scroll::-webkit-scrollbar{display:none;width:0;height:0}
.fade-y{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent 100%)}
</style>

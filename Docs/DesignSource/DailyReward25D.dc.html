<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3A2412;text-decoration:none}a:hover{color:#000}
.txt3d{-webkit-text-stroke:5px #3A2412;paint-order:stroke fill;text-shadow:0 4px 0 #3A2412,0 8px 12px rgba(0,0,0,.25)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid #3A2412;border-radius:18px;background:linear-gradient(180deg,var(--hi) 0%,var(--base) 55%,var(--lo) 100%);box-shadow:0 5px 0 var(--edge),0 10px 14px rgba(0,0,0,.22),inset 0 -3px 0 rgba(0,0,0,.08);position:relative;font-family:inherit;font-weight:800;color:#3A2412;cursor:pointer;transition:transform .08s,box-shadow .08s}
.gbtn::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:40%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge),0 4px 6px rgba(0,0,0,.25)}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:62px;box-sizing:border-box;padding:4px 2px 4px;border:2.5px solid #3A2412;border-radius:14px;font-family:inherit;color:#3A2412;cursor:default;animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both}
.cell .dn{font-size:11px;font-weight:800;line-height:1}
.cell .lb{font-size:10.5px;font-weight:800;line-height:1;white-space:nowrap;letter-spacing:-.1px}
.cell svg.ic{width:28px;height:28px;display:block}
.cell.big svg.ic{width:32px;height:32px}
.cell.big .lb{font-size:9.5px}
.tick{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:#2E9E44;border:2px solid #3A2412;box-sizing:border-box;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #1F6B2E}
.tick svg{width:12px;height:12px;display:block}
.miss{position:absolute;inset:0;border-radius:11px;background:rgba(80,70,60,.45);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.bu{border:2px solid #3A2412;border-radius:999px;padding:0 6px;font-family:inherit;font-size:10px;font-weight:800;line-height:15px;color:#FFFFFF;background:linear-gradient(180deg,#8FD3FF,#3FA9F5);cursor:pointer;display:flex;align-items:center;gap:2px}
.todayTag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;border:2px solid #3A2412;border-radius:999px;padding:0 5px;font-size:9px;font-weight:800;line-height:13px;color:#FFFFFF;background:linear-gradient(180deg,#FF8A80,#E53935)}
.glow{animation:glow 1.1s ease-in-out infinite alternate}
.bounce{animation:bounce 1.6s ease-in-out infinite}
.rays{animation:spin 30s linear infinite}
.breathe{animation:breathe 1.4s ease-in-out infinite}
.shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:40px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:sweep 2.8s ease-in-out infinite}
.fill{height:100%;border-radius:5px;background:linear-gradient(180deg,#FFE68A,#FFC93C 55%,#F0A400);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transition:width .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{from{box-shadow:0 3px 0 #B87800,0 0 0 0 rgba(255,225,74,0)}to{box-shadow:0 3px 0 #B87800,0 0 14px 4px rgba(255,225,74,.95)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes sweep{0%,55%{left:-60px}85%,100%{left:110%}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>
</helmet>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 52px 16px 20px; display: flex; flex-direction: column; gap: 10px">

      <h1 class="txt3d" style="margin: 0; flex: 1; min-width: 0; font-size: 30px; line-height: 1; color: #FFFFFF; white-space: nowrap">ĐIỂM DANH</h1>
    </div>

    <!-- grand prize -->
    <div style="position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px 12px; border: 3px solid #3A2412; border-radius: 22px; background: linear-gradient(180deg, #FFF3B0, #FFC93C 70%, #F0A400); box-shadow: 0 5px 0 #B87800, 0 12px 18px rgba(0,0,0,.22)">
      <span class="shine"></span>
      <div class="bounce" style="flex: none; width: 76px; height: 76px; border-radius: 18px; border: 3px solid #3A2412; background: radial-gradient(circle at 40% 35%, #F3E8FF, #B07CF0 70%, #7A44C8); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #5A2AA0">
        <svg viewBox="0 0 100 100" width="62" height="62" aria-hidden="true"><use href="#icVip"/></svg>
      </div>
      <div style="position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-size: 12px; font-weight: 800; color: #6B4A00">Quà ngày 30</span></div>
        <div style="font-size: 20px; font-weight: 800; line-height: 1">Gậy Bóng Chày</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #5E3E00; line-height: 1.15">Dùng miễn phí 7 ngày · +20% xu mỗi ván</div>
        <div style="position: relative; height: 26px; margin: 2px 6px 0 2px">
          <div style="position: absolute; left: 0; right: 0; top: 7px; height: 12px; border-radius: 6px; border: 2px solid #3A2412; background: linear-gradient(180deg, #CFC5B2, #E9E1D0); overflow: hidden; box-sizing: border-box"><div class="fill" style="{{barStyle}}"></div></div>
          <div style="position: absolute; left: calc(23.33%); top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #3A2412; background: {{m7.bg}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><use href="#icChest"/></svg></div><div style="position: absolute; left: calc(46.67%); top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #3A2412; background: {{m14.bg}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><use href="#icDino"/></svg></div><div style="position: absolute; left: calc(70.00%); top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #3A2412; background: {{m21.bg}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><use href="#icChest"/></svg></div><div style="position: absolute; left: calc(100% - 6px); top: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid #3A2412; background: {{m30.bg}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><use href="#icVip"/></svg></div>
        </div>
        <div style="font-size: 12px; font-weight: 800">Đã điểm danh {{count}}/30 ngày</div>
      </div>
    </div>

    <!-- calendar -->
    <div style="background: linear-gradient(180deg, #FFFBEF, #F7E9C6); border: 3px solid #3A2412; border-radius: 24px; box-shadow: 0 6px 0 #B9A98C, 0 18px 26px rgba(0,0,0,.25); padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 6px">
        <sc-for list="{{days}}" as="c" hint-placeholder-count="30">
          <div class="{{c.cls}}" style="{{c.style}}" aria-label="{{c.aria}}">
            <span class="dn">{{c.n}}</span>
            <svg class="ic" viewBox="0 0 100 100" aria-hidden="true"><use href="{{c.icon}}"/></svg>
            <span class="lb">{{c.label}}</span>
            <sc-if value="{{c.claimed}}" hint-placeholder-val="{{ false }}"><span class="tick" aria-label="Đã nhận"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span></sc-if>
            <sc-if value="{{c.missed}}" hint-placeholder-val="{{ false }}"><span class="miss"><button class="bu" onClick="{{c.makeUp}}" aria-label="Xem quảng cáo để điểm danh bù"><svg viewBox="0 0 24 24" width="11" height="11" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="#FFFFFF" stroke="#3A2412" stroke-width="2"/><path d="M10 9.5v5l4.5-2.5z" fill="#3A2412"/></svg>Bù</button></span></sc-if>
            <sc-if value="{{c.today}}" hint-placeholder-val="{{ false }}"><span class="todayTag">HÔM NAY</span></sc-if>
          </div>
        </sc-for>
      </div>
      <p style="margin: 0; text-align: center; font-size: 11.5px; font-weight: 700; color: #5E4E3A; line-height: 1.3">Lỡ ngày? Xem quảng cáo để điểm danh bù · còn {{makeUpLeft}}/3</p>
    </div>

    <div style="flex: 1"></div>
    <sc-if value="{{canClaim}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{claim}}" class="gbtn breathe" style="--hi: #FFE68A; --base: #FFC93C; --lo: #F0A400; --edge: #B87800; height: 60px; font-size: 26px; border-radius: 22px"><span class="txt3d" style="position: relative; color: #FFFFFF; -webkit-text-stroke-width: 4px; text-shadow: 0 3px 0 #3A2412">NHẬN</span></button>
      <button onClick="{{claimDouble}}" class="gbtn" style="--hi: #D8F1FF; --base: #8FD3FF; --lo: #4FB0EE; --edge: #2A7FBF; height: 48px; font-size: 16px; border-radius: 18px">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="position: relative"><rect x="2.5" y="5" width="19" height="14" rx="3" fill="#FFFFFF" stroke="#3A2412" stroke-width="1.8"/><path d="M10 9.5v5l4.5-2.5z" fill="#3A2412"/></svg>
        <span style="position: relative">Xem quảng cáo nhận x2</span>
      </button>
    </sc-if>
    <sc-if value="{{claimedToday}}" hint-placeholder-val="{{ false }}">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

    const claimed = {}; for (let d = 1; d <= 11; d++) if (d !== 9) claimed[d] = true;
    this.state = { today: 12, claimed, makeUpLeft: 3, got: '', left: 14 * 3600 + 25 * 60 };
    this.R = {"1": ["coin", "#icCoin", "100 xu", "100 xu"], "2": ["time", "#icTime", "×2", "+5 Giây x2"], "3": ["coin", "#icCoin", "150 xu", "150 xu"], "4": ["x2", "#icX2", "×1", "Nhân Đôi x1"], "5": ["coin", "#icCoin", "200 xu", "200 xu"], "6": ["shield", "#icShield", "×2", "Khiên x2"], "7": ["chest", "#icChest", "Bí ẩn", "Rương bí ẩn"], "8": ["coin", "#icCoin", "150 xu", "150 xu"], "9": ["freeze", "#icFreeze", "×2", "Đóng Băng x2"], "10": ["coin", "#icCoin", "200 xu", "200 xu"], "11": ["fire", "#icFire", "×1", "Bùa Combo x1"], "12": ["coin", "#icCoin", "250 xu", "250 xu"], "13": ["time", "#icTime", "×3", "+5 Giây x3"], "14": ["dino", "#icDino", "Capybara", "Capybara"], "15": ["coin", "#icCoin", "200 xu", "200 xu"], "16": ["x2", "#icX2", "×2", "Nhân Đôi x2"], "17": ["coin", "#icCoin", "250 xu", "250 xu"], "18": ["shield", "#icShield", "×3", "Khiên x3"], "19": ["coin", "#icCoin", "300 xu", "300 xu"], "20": ["freeze", "#icFreeze", "×3", "Đóng Băng x3"], "21": ["chest", "#icChest", "Bí ẩn", "Rương bí ẩn"], "22": ["coin", "#icCoin", "250 xu", "250 xu"], "23": ["fire", "#icFire", "×2", "Bùa Combo x2"], "24": ["coin", "#icCoin", "300 xu", "300 xu"], "25": ["time", "#icTime", "×5", "+5 Giây x5"], "26": ["coin", "#icCoin", "400 xu", "400 xu"], "27": ["x2", "#icX2", "×3", "Nhân Đôi x3"], "28": ["coin", "#icCoin", "500 xu", "500 xu"], "29": ["chest", "#icChest", "Bí ẩn", "Rương bí ẩn"], "30": ["vip", "#icVip", "7 ngày", "Gậy Bóng Chày (dùng miễn phí 7 ngày)"]};

    const s = this.state, R = this.R, pad = (n) => (n < 10 ? '0' : '') + n;
    const MILE = { 7: 1, 14: 1, 21: 1, 30: 2 };
    const count = Object.keys(s.claimed).length;
    const days = [];
    for (let d = 1; d <= 30; d++) {
      const [kind, icon, label, full] = R[d];
      const claimed = !!s.claimed[d], today = d === s.today && !claimed, missed = d < s.today && !claimed, future = d > s.today;
      const m = MILE[d];
      const purple = d === 14;
      let bg = m === 2 ? 'linear-gradient(180deg, #FFF3B0, #FFC93C)' : purple ? 'linear-gradient(180deg, #F3E8FF, #D8BEFA)' : 'linear-gradient(180deg, #FFFFFF, #F1EADC)';

      if (today) { bg = 'linear-gradient(180deg, #FFF6C8, #FFD84A)'; edge = '#B87800'; }
      if (claimed && m !== 2 && !purple) { bg = 'linear-gradient(180deg, #F1FBEA, #CFEFC4)'; edge = '#8FBF7E'; }
      days.push({
        n: d, icon, label, claimed, today, missed,
        cls: 'cell' + (m ? ' big' : '') + (today ? ' glow' : ''),
        aria: 'Ngày ' + d + ': ' + full + (claimed ? ', đã nhận' : missed ? ', bỏ lỡ' : today ? ', hôm nay' : ''),

        makeUp: () => { if (s.makeUpLeft <= 0) return; this.setState({ claimed: Object.assign({}, s.claimed, { [d]: true }), makeUpLeft: s.makeUpLeft - 1 }); }

    const claimedToday = !!s.claimed[s.today];
    const take = (txt) => this.setState({ claimed: Object.assign({}, s.claimed, { [s.today]: true }), got: txt });
    const h = Math.floor(s.left / 3600), mi = Math.floor((s.left % 3600) / 60), se = s.left % 60;
    return {
      days, count, makeUpLeft: s.makeUpLeft,
      barStyle: 'width: ' + Math.round(count / 30 * 100) + '%',
      m7: mile(7), m14: mile(14), m21: mile(21), m30: mile(30),
      canClaim: !claimedToday, claimedToday,
      gotText: s.got || R[s.today][3],
      nextText: pad(h) + ':' + pad(mi) + ':' + pad(se),
      claim: () => take(R[s.today][3]),
      claimDouble: () => take(R[s.today][3] + ' (x2)')
    };
  }
}

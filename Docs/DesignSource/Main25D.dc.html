.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 3.4s linear infinite}
.breathe{animation:breathe 1.4s ease-in-out infinite}
.wiggle{transform-origin:50% 80%;animation:wiggle 2.4s ease-in-out infinite}
.logo{animation:logoIn .7s cubic-bezier(.2,.9,.3,1.3) both}
.shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:40px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:sweep 2.8s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(20px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-12deg)}88%{transform:rotate(10deg)}92%{transform:rotate(-6deg)}96%{transform:rotate(4deg)}}
@keyframes logoIn{0%{transform:scale(.3) rotate(-3deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
@keyframes sweep{0%,55%{left:-60px}85%,100%{left:110%}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
</style>

body{margin:0}

.gbtn{display:flex;align-items:center;justify-content:center;gap:6px;border:3px solid #3A2412;border-radius:18px;background:linear-gradient(180deg,var(--hi) 0%,var(--base) 55%,var(--lo) 100%);box-shadow:0 5px 0 var(--edge),0 10px 14px rgba(0,0,0,.22),inset 0 -3px 0 rgba(0,0,0,.08);position:relative;font-family:inherit;font-weight:800;color:#3A2412;cursor:pointer;transition:transform .08s,box-shadow .08s}
.gbtn::after{content:"";position:absolute;left:8%;right:8%;top:3px;height:40%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,0));pointer-events:none}
.gbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge),0 4px 6px rgba(0,0,0,.25)}
.panel{background:linear-gradient(180deg,#FFFFFF 0%,#F3EEE4 100%);border:3px solid #3A2412;border-radius:16px;box-shadow:0 4px 0 #B9A98C,0 8px 12px rgba(0,0,0,.18)}
.av{flex:none;border-radius:50%;border:3px solid #3A2412;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.pod{animation:podUp .55s cubic-bezier(.2,.9,.3,1.25) both;transform-origin:50% 100%}
.crown{animation:crown 1.6s ease-in-out infinite}
.row{animation:rowIn .4s cubic-bezier(.2,.9,.3,1.2) both}
.rays{animation:spin 26s linear infinite}
@keyframes podUp{from{transform:scaleY(0);opacity:0}to{transform:none;opacity:1}}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(6deg)}}
@keyframes rowIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important}}
.soft-scroll{scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.soft-scroll::-webkit-scrollbar{display:none;width:0;height:0}
.fade-y{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 28px),transparent 100%)}
</style>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 16px 20px; display: flex; flex-direction: column; gap: 12px">

        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3A2412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: relative"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <h1 class="txt3d" style="margin: 0; flex: 1; min-width: 0; font-size: 30px; line-height: 1; color: #FFFFFF; white-space: nowrap">XẾP HẠNG</h1>
    </div>

    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: linear-gradient(180deg, #E9DFCB, #F6F0E4); border: 3px solid #3A2412; border-radius: 16px; padding: 4px; gap: 4px; box-shadow: inset 0 3px 4px rgba(0,0,0,.15)">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{tb.selected}}" onClick="{{tb.pick}}" class="gbtn" style="{{tb.style}}">{{tb.label}}</button>
      </sc-for>
    </div>

    <!-- podium -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 6px; margin-top: 4px">
      <sc-for list="{{podium}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
          <sc-if value="{{p.first}}" hint-placeholder-val="{{ false }}">
            <svg class="crown" viewBox="0 0 48 32" width="44" height="30" aria-hidden="true"><path d="M4 28 L8 6 L18 18 L24 3 L30 18 L40 6 L44 28 Z" fill="url(#kCoin)" stroke="#3A2412" stroke-width="2.5" stroke-linejoin="round"/><circle cx="24" cy="20" r="3" fill="#E53935" stroke="#3A2412" stroke-width="1.5"/></svg>
          </sc-if>
          <div class="av" style="{{p.avStyle}}"><svg viewBox="0 0 100 100" width="78%" height="78%" aria-hidden="true"><use href="{{p.av}}"></use></svg></div>
          <div style="font-size: 14px; font-weight: 800; color: #FFFFFF; text-shadow: 0 2px 0 rgba(0,0,0,.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{p.name}}</div>
          <div class="pod" style="{{p.podStyle}}">
            <span class="txt3d" style="font-size: 34px; line-height: 1; color: #FFFFFF; -webkit-text-stroke-width: 4px">{{p.rank}}</span>
            <span style="font-size: 15px; font-weight: 800">{{p.score}}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- list -->
    <div class="panel" style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 22px; background: linear-gradient(180deg, #FFFBEF, #F7E9C6); box-shadow: 0 5px 0 #4A2E8A, 0 12px 18px rgba(0,0,0,.3)">
      <div class="soft-scroll fade-y" style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="row" style="{{r.style}}">
          <span style="width: 30px; text-align: center; font-size: 18px; font-weight: 800; color: #5E4E3A">{{r.rank}}</span>
          <div class="av" style="width: 40px; height: 40px; border-width: 2px; background: {{r.bg}}"><svg viewBox="0 0 100 100" width="80%" height="80%" aria-hidden="true"><use href="{{r.av}}"></use></svg></div>
          <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
          <span style="font-size: 16px; font-weight: 800">{{r.score}}</span>
        </div>
      </sc-for>
      </div>
    </div>

    <!-- me -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 3px solid #3A2412; border-radius: 18px; background: linear-gradient(180deg, #FFE68A, #FFC93C 55%, #F0A400); box-shadow: 0 5px 0 #B87800, 0 12px 16px rgba(0,0,0,.3)">

      <div style="flex: 1; min-width: 0; line-height: 1.1">
        <div style="font-size: 17px; font-weight: 800">Bạn</div>

      <span style="font-size: 18px; font-weight: 800">{{meScore}}</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { tab: 'friends' };
    this.data = {
      friends: { me: [4, 1280], list: [
        ['Bảo Bối', '#aCat', 2410], ['Minh Búa', '#aFox', 1985], ['Thỏ Con', '#aMouse', 1630], ['Bạn', null, 1280],
        ['Na Na', '#aPig', 1105], ['Tí Đập', '#aCrab', 940], ['Cún Lì', '#aOcto', 720], ['Su Su', '#aCat', 510] ] },
      world: { me: [1284, 1280], list: [
        ['VuaCombo', '#aFox', 9820], ['BúaThần', '#aCat', 9415], ['ĐậpLiênTay', '#aCrab', 9102], ['MèoMập99', '#aPig', 8760],
        ['GàVàng', '#aMouse', 8530], ['SaoBiển', '#aOcto', 8215], ['KhủngLongCon', '#aDog', 7990], ['TayNhanh', '#aFox', 7802], ['ThợĐập', '#aCrab', 7655] ] }
    };
  }
  renderVals() {
    const s = this.state;
    const fmt = (n) => n.toLocaleString('vi-VN');
    const d = this.data[s.tab];
    const bgs = ['#FFF3D6', '#E8F6FF', '#FFE9EF', '#EFFFE6', '#F2EAFF'];
    const all = d.list.map(([name, av, score], i) => ({ name, av: av || '#aDog', score, rank: i + 1, me: av === null }));
    const order = [1, 0, 2];
    const podCfg = [
      { h: 112, g: 'linear-gradient(180deg, #FFF3A0, #FFC93C 55%, #E0A000)', edge: '#B87800', size: 76 },
      { h: 84, g: 'linear-gradient(180deg, #FFFFFF, #CFD8E2 55%, #9AA8B8)', edge: '#6E7A88', size: 64 },
      { h: 66, g: 'linear-gradient(180deg, #FFD3A8, #E59A5A 55%, #B8682A)', edge: '#8A4A18', size: 60 }
    ];
    const podium = order.map((idx, k) => {
      const p = all[idx]; const c = podCfg[idx];
      return {
        first: idx === 0,
        name: p.me ? 'Bạn' : p.name,
        av: p.av,
        rank: p.rank,
        score: fmt(p.score),
        avStyle: 'width: ' + c.size + 'px; height: ' + c.size + 'px; background: ' + bgs[idx] + '; box-shadow: 0 0 0 4px ' + (idx === 0 ? '#FFE14A' : 'rgba(255,255,255,.5)'),
        podStyle: 'width: 100%; height: ' + c.h + 'px; box-sizing: border-box; border: 3px solid #3A2412; border-bottom: 0; border-radius: 16px 16px 0 0; background: ' + c.g + '; box-shadow: inset 0 4px 0 rgba(255,255,255,.5), inset 0 -6px 0 ' + c.edge + '; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; animation-delay: ' + (k * 0.12) + 's'
      };
    });
    const rows = all.slice(3).map((p, i) => ({
      rank: p.rank,
      name: p.me ? 'Bạn' : p.name,
      av: p.av,
      bg: bgs[(i + 3) % bgs.length],
      score: fmt(p.score),
      style: 'display: flex; align-items: center; gap: 10px; padding: 6px 6px; border-bottom: 2px dashed #D9CBB0; animation-delay: ' + (0.3 + i * 0.05) + 's' + (p.me ? '; background: rgba(255, 201, 60, .35); border-radius: 12px' : '')
    }));
    const [meRank, meScore] = d.me;
    return {
      podium,
      rows,
      meRank: fmt(meRank),
      meScore: fmt(meScore),
      meHint: s.tab === 'friends' ? 'Còn 351 điểm nữa để lên hạng 3' : 'Top 12% người chơi tuần này',
      tabs: [['friends', 'Bạn bè'], ['world', 'Toàn quốc']].map(([id, label]) => ({
        label,
        selected: String(s.tab === id),
        style: 'height: 40px; border-width: 2px; border-radius: 12px; font-size: 16px; ' + (s.tab === id ? '--hi: #FFE68A; --base: #FFC93C; --lo: #F0A400; --edge: #B87800; box-shadow: 0 3px 0 #B87800' : '--hi: transparent; --base: transparent; --lo: transparent; --edge: transparent; border-color: transparent; box-shadow: none; color: #5E4E3A'),
        pick: () => this.setState({ tab: id })
      }))
    };
  }
}
</script>
